<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MPK Drobin - Zintegrowany System Transportowy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --accent-maroon: #5c1218;
      --accent-maroon-bright: #8a1c24;
      --accent-maroon-glow: rgba(138, 28, 36, 0.35);
      --accent-cream: #f5e8d0;
      --accent-cream-dim: #c5b8a0;
      --glass-bg: rgba(18, 18, 18, 0.85);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-white: #ffffff;
      --text-dim: #999999;
      --penalty-red: #ff3333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100vw; height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    .app-viewport { display: flex; width: 100vw; height: 100dvh; position: relative; overflow: hidden; }

    .bg-glow-top-right {
      position: absolute; width: 700px; height: 700px;
      background: radial-gradient(circle, var(--accent-maroon-glow) 0%, rgba(0,0,0,0) 70%);
      top: -20%; right: -10%; filter: blur(90px); pointer-events: none; z-index: 1;
    }

    /* EKRAN LOGOWANIA */
    #login-screen {
      position: fixed; inset: 0; background: #000; z-index: 2000;
      display: flex; justify-content: center; align-items: center; padding: 20px;
      overflow-y: auto;
    }

    .login-container {
      position: relative; width: 100%; max-width: 420px;
      background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(25px);
      border: 1px solid rgba(138, 28, 36, 0.4); border-radius: 28px;
      padding: 36px 28px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9); text-align: center;
    }

    .brand-title { font-size: 26px; font-weight: 800; color: var(--accent-cream); letter-spacing: 2px; margin-bottom: 5px; }
    .brand-sub { font-size: 13px; color: var(--accent-cream-dim); margin-bottom: 25px; }

    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #ccc; margin-bottom: 4px; margin-left: 4px; }

    .input-pill {
      width: 100%; height: 42px; background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
      padding: 0 16px; font-size: 14px; font-weight: 600; color: #fff; outline: none;
      transition: all 0.25s ease; font-family: inherit;
    }
    .input-pill:focus { border-color: var(--accent-maroon-bright); background: rgba(255, 255, 255, 0.12); }

    select.input-pill { background-color: #1a1a1a; color: #ffffff; }
    select.input-pill option { background-color: #141414; color: #ffffff; padding: 10px; }
    textarea.input-pill { height: 100px; padding: 10px 14px; resize: none; }

    .btn-maroon {
      width: 100%; height: 44px;
      background: linear-gradient(135deg, #70151c 0%, #3e0b10 100%);
      border: 1px solid rgba(245, 232, 208, 0.2); border-radius: 14px; color: var(--accent-cream);
      font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 5px;
      box-shadow: 0 8px 20px rgba(92, 18, 24, 0.4); transition: all 0.25s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-maroon:hover { transform: translateY(-2px); filter: brightness(1.15); }
    .btn-maroon:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-drive-start { 
      background: linear-gradient(135deg, #70151c 0%, #450c11 100%) !important; 
      color: var(--accent-cream) !important;
      border: 1px solid rgba(245, 232, 208, 0.25) !important;
      box-shadow: 0 6px 16px rgba(112, 21, 28, 0.35) !important; 
    }
    .btn-drive-next { 
      background: linear-gradient(135deg, #2b3a4a 0%, #1a232e 100%) !important; 
      color: #e3edf7 !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 6px 16px rgba(43, 58, 74, 0.3) !important; 
    }

    #main-layout { display: none; width: 100vw; height: 100dvh; position: relative; z-index: 2; }

    .toggle-sidebar-btn {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-sidebar-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .sidebar-menu {
      width: 260px; height: 100%;
      background: var(--glass-bg); backdrop-filter: blur(35px);
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px 14px; z-index: 10; transition: all 0.3s ease;
      position: relative;
    }
    .sidebar-menu.hidden { margin-left: -260px; }

    .nav-list { display: flex; flex-direction: column; gap: 6px; margin-top: 40px; }

    .content-area {
      flex: 1; height: 100%; overflow-y: auto; padding: 60px 20px 20px 20px;
      display: flex; flex-direction: column; position: relative;
    }

    .view-section { display: none; width: 100%; height: 100%; flex-direction: column; }
    .view-section.active-view { display: flex; }

    .glass-card {
      background: rgba(18, 18, 18, 0.65); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 18px;
      margin-bottom: 12px; transition: all 0.5s ease;
    }

    .card-title-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
      z-index: 1000; justify-content: center; align-items: center; padding: 15px;
    }
    .modal-box {
      width: 100%; max-width: 650px; background: #121212; border: 1px solid rgba(138, 28, 36, 0.5);
      border-radius: 20px; padding: 22px; max-height: 90vh; overflow-y: auto;
    }

    .grafik-container { display: flex; gap: 15px; height: 100%; }
    .grafik-main { flex: 1; display: flex; flex-direction: column; }
    .grafik-sidebar {
      width: 300px; background: rgba(12, 12, 12, 0.85); border: 1px solid var(--glass-border);
      border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }

    .loop-overlay {
      display: none; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(15px); z-index: 50; border-radius: 20px;
      flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
    }

    body.is-mobile .sidebar-menu { position: absolute; left: 0; top: 0; bottom: 0; width: 240px; z-index: 1000; box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
    body.is-mobile .sidebar-menu.hidden { margin-left: -250px; }
    body.is-mobile .content-area { padding: 55px 10px 10px 10px !important; }
  </style>
</head>
<body>

  <!-- EKRAN LOGOWANIA -->
  <div id="login-screen">
    <div class="login-container">
      <div class="brand-title">MPK DROBIN</div>
      <div class="brand-sub">ZINTERAWANY SYSTEM TRANSPORTOWY</div>

      <div class="form-group">
        <label>Użytkownik / Login</label>
        <input type="text" id="l-user" class="input-pill" value="Bartosz" placeholder="Bartosz (Dyspozytor) lub login">
      </div>

      <div class="form-group">
        <label>Hasło Dostępowe</label>
        <input type="password" id="l-pass" class="input-pill" value="bartosz2011!@#" placeholder="Wpisz hasło">
      </div>

      <div class="form-group">
        <label>Wybierz Urządzenie</label>
        <select id="l-device" class="input-pill">
          <option value="desktop">🖥️ Komputer / Tablet (Duży ekran)</option>
          <option value="mobile" selected>📱 Telefon (iOS / Android)</option>
        </select>
      </div>

      <button class="btn-maroon" id="btn-login-main">Zaloguj się do Systemu ➔</button>
      <p id="login-err" style="color: #ff6b6b; font-size: 12px; margin-top: 8px; display: none;">Nieprawidłowy login lub hasło!</p>
    </div>
  </div>

  <!-- APLIKACJA GŁÓWNA -->
  <div id="main-layout" class="app-viewport">
    <div class="bg-glow-top-right"></div>

    <button class="toggle-sidebar-btn" id="btn-toggle-sidebar">☰</button>

    <!-- SIDEBAR -->
    <div class="sidebar-menu" id="sidebar">
      <div>
        <div id="sidebar-role-title" style="font-size: 16px; font-weight: 800; color: var(--accent-cream); text-align: center; margin-top: 5px;">
          👨‍💻 DYSPOZYTORNIA
        </div>
        <div class="nav-list" id="sidebar-nav-container"></div>
      </div>

      <div style="padding: 8px; text-align: center; font-size: 11px; color: var(--text-dim); border-top: 1px solid rgba(255,255,255,0.1);">
        Zalogowano jako: <strong id="logged-user-label" style="color: #fff;">-</strong>
        <br><span style="cursor: pointer; color: var(--accent-cream-dim); margin-top: 4px; display: inline-block;" id="btn-logout">Wyloguj</span>
      </div>
    </div>

    <!-- CONTENT AREA -->
    <div class="content-area">

      <!-- DYSPOZYTOR: LINIE -->
      <div id="view-disp-linie" class="view-section">
        <div class="card-title-bar">
          <h2>Lista Aktywnych Linii i Przystanków</h2>
          <div style="display: flex; gap: 8px;">
            <button class="btn-maroon" style="width: auto; padding: 0 14px;" id="btn-create-line">+ Stwórz Nową Linię</button>
            <button class="btn-maroon" style="width: auto; padding: 0 14px; background: #222;" id="btn-open-stops-db">🚏 Baza Przystanków</button>
          </div>
        </div>
        <div id="lista-linii-glowne" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px;"></div>
      </div>

      <!-- DYSPOZYTOR: GRAFIK -->
      <div id="view-disp-grafik" class="view-section">
        <div class="card-title-bar">
          <h2>Grafik Służb Kierowców z Planowaniem Przerw</h2>
        </div>
        <div class="grafik-container">
          <div class="grafik-main glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <div class="form-group" style="margin: 0; width: 220px;">
                <label>Wybierz Kierowcę:</label>
                <select id="select-grafik-kierowca" class="input-pill"></select>
              </div>
            </div>
            <div class="calendar-grid" id="disp-cal-grid"></div>
          </div>

          <div class="grafik-sidebar">
            <h3 style="color: var(--accent-cream); font-size: 15px;">Przydziel Służbę / Wolne / Urlop</h3>
            <div id="wybrany-dzien-label" style="font-size: 12px; font-weight: 700; color: #fff;">Wybrany Dzień: Brak</div>

            <div class="form-group">
              <label>Wybierz Status / Linię</label>
              <select id="g-select-linia" class="input-pill"></select>
            </div>

            <div id="grafik-shift-options">
              <div class="form-group">
                <label>Liczba Kółek Do Zrobienia</label>
                <input type="number" id="g-koolka" class="input-pill" value="5" min="1" max="15">
              </div>

              <div class="form-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
                <label>Przerwa Po Którym Kółku?</label>
                <input type="number" id="g-przerwa-po-kolku" class="input-pill" value="2" min="1" max="15">
              </div>

              <div class="form-group">
                <label>Czas Przerwy (Minuty)</label>
                <input type="number" id="g-przerwa-czas" class="input-pill" value="15" min="5" max="60" step="5">
              </div>
            </div>

            <button class="btn-maroon" id="btn-save-schedule">Zapisz i Wyślij Powiadomienie 🔔</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDlkKWLR06aHccoBBTBAnANFkLv7ewudiI",
      authDomain: "drobinmpk.firebaseapp.com",
      databaseURL: "https://drobinmpk-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "drobinmpk",
      storageBucket: "drobinmpk.firebasestorage.app",
      messagingSenderId: "921596374960",
      appId: "1:921596374960:web:cb2d647540722114f5b075"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let selectedDay = null;
    let selectedDriverId = null;

    // Funkcja odwracania przystanków dla kółka drugiego i kolejnych parzystych
    function pobierzPrzystankiDlaKolka(linia, numerKolka) {
      if (!linia || !linia.przystanki) return [];
      const kopia = [...linia.przystanki];
      if (numerKolka % 2 === 0) {
        return kopia.reverse();
      }
      return kopia;
    }

    // Wyznaczanie kierunku jazdy w zależności od kółka
    function pobierzKierunekDlaKolka(linia, numerKolka) {
      if (!linia || !linia.kierunek) return "";
      const czesci = linia.kierunek.split("<->").map(s => s.trim());
      if (czesci.length < 2) return linia.kierunek;

      if (numerKolka % 2 === 0) {
        return `${czesci[1]} ➔ ${czesci[0]}`;
      } else {
        return `${czesci[0]} ➔ ${czesci[1]}`;
      }
    }

    // Pobieranie listy linii z bazy danych
    onValue(ref(db, 'linie'), (snapshot) => {
      const data = snapshot.val();
      uaktualnijSelectLinii(data);
    });

    function uaktualnijSelectLinii(linieData) {
      const select = document.getElementById('g-select-linia');
      if (!select) return;
      select.innerHTML = '';

      if (linieData) {
        Object.values(linieData).forEach(l => {
          select.innerHTML += `<option value="${l.numer}">${l.numer} (${l.kierunek})</option>`;
        });
      }

      select.innerHTML += `<option value="URLOP">🏖️ Urlop</option>`;
      select.innerHTML += `<option value="WOLNE">😴 Dzień Wolny</option>`;
    }

    // Ukrywanie opcji kółek po wybraniu "Urlop" lub "Wolne"
    document.getElementById('g-select-linia')?.addEventListener('change', (e) => {
      const val = e.target.value;
      const optionsBox = document.getElementById('grafik-shift-options');
      if (val === 'URLOP' || val === 'WOLNE') {
        optionsBox.style.display = 'none';
      } else {
        optionsBox.style.display = 'block';
      }
    });

    // Zapisywanie grafiku do bazy Firebase
    document.getElementById('btn-save-schedule')?.addEventListener('click', async () => {
      const liniaVal = document.getElementById('g-select-linia').value;
      const koolkaVal = parseInt(document.getElementById('g-koolka').value) || 0;
      const przerwaCzas = parseInt(document.getElementById('g-przerwa-czas').value) || 0;
      const przerwaPo = parseInt(document.getElementById('g-przerwa-po-kolku').value) || 0;

      if (!selectedDriverId || !selectedDay) {
        alert("Wybierz kierowcę i dzień z kalendarza!");
        return;
      }

      const scheduleKey = `${selectedDriverId}_${selectedDay}`;
      const payload = {
        linia: liniaVal,
        koleka: (liniaVal === 'URLOP' || liniaVal === 'WOLNE') ? 0 : koolkaVal,
        przerwaCzas: przerwaCzas,
        przerwaPo: przerwaPo
      };

      await set(ref(db, `grafik/${scheduleKey}`), payload);
      alert("Pomyślnie zapisano w bazie Firebase!");
    });
  </script>
</body>
</html>
